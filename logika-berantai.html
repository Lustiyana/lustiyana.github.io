<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo Domino: Logika Berantai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');
        body { font-family: 'Fredoka', sans-serif; background-color: #eef2ff; }
        .chain-card { transition: all 0.3s ease; }
        .arrow-down { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 15px solid #6366f1; margin: 10px auto; }
        .active-chain { border-color: #6366f1; background-color: #f5f3ff; transform: scale(1.02); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border-t-8 border-indigo-600">
        <!-- Header -->
        <div class="p-6 text-center bg-indigo-50">
            <h1 class="text-2xl font-bold text-indigo-700">🔗 Logika Berantai</h1>
            <p class="text-indigo-500 text-sm">Ikuti alurnya seperti efek domino!</p>
            <div id="level-indicator" class="mt-2 inline-block bg-indigo-600 text-white px-4 py-1 rounded-full text-xs font-bold uppercase">Misi 1 / 10</div>
        </div>

        <!-- Area Cerita Berantai -->
        <div class="p-8">
            <div id="chain-container" class="space-y-4">
                <!-- Step 1 -->
                <div id="step-1" class="chain-card p-4 border-2 border-gray-100 rounded-2xl flex items-center gap-4">
                    <div class="text-3xl" id="icon-1">🐟</div>
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase">Jika...</p>
                        <p id="text-1" class="text-gray-700 font-semibold">Ikan Berenang</p>
                    </div>
                </div>

                <div class="arrow-down opacity-20" id="arrow-1"></div>

                <!-- Step 2 -->
                <div id="step-2" class="chain-card p-4 border-2 border-gray-100 rounded-2xl opacity-30 flex items-center gap-4">
                    <div class="text-3xl" id="icon-2">🌊</div>
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase">Maka...</p>
                        <p id="text-2" class="text-gray-700 font-semibold">Ikan di Air</p>
                    </div>
                </div>

                <div class="arrow-down opacity-20" id="arrow-2"></div>

                <!-- Step 3 -->
                <div id="step-3" class="chain-card p-4 border-2 border-gray-100 rounded-2xl opacity-30 flex items-center gap-4">
                    <div class="text-3xl" id="icon-3">🐋</div>
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase">Maka...</p>
                        <p id="text-3" class="text-gray-700 font-semibold">Paus Muncul!</p>
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="mt-10">
                <p id="question-text" class="text-center mb-4 font-bold text-indigo-800">Apa yang terjadi jika Ikan Berenang?</p>
                <div id="action-buttons" class="grid grid-cols-2 gap-3">
                    <!-- Buttons will be injected here -->
                </div>
            </div>
            
            <div id="feedback" class="mt-6 text-center font-bold min-h-[24px]"></div>
        </div>
    </div>

    <script>
        const missions = [
            {
                q: "Ikan berenang!",
                steps: [
                    { icon: "🐟", text: "Ikan Berenang" },
                    { icon: "🌊", text: "Ikan di Air" },
                    { icon: "🐋", text: "Paus Muncul!" }
                ],
                target: "Paus Muncul!",
                options: ["Paus Muncul!", "Kucing Tidur"]
            },
            {
                q: "Hari Hujan!",
                steps: [
                    { icon: "☁️", text: "Hari Hujan" },
                    { icon: "🌱", text: "Tanah Basah" },
                    { icon: "🌸", text: "Bunga Tumbuh" }
                ],
                target: "Bunga Tumbuh",
                options: ["Bunga Tumbuh", "Tanah Kering"]
            },
            {
                q: "Matahari Terbit!",
                steps: [
                    { icon: "☀️", text: "Matahari Terbit" },
                    { icon: "🐓", text: "Ayam Berkokok" },
                    { icon: "👦", text: "Budi Bangun" }
                ],
                target: "Budi Bangun",
                options: ["Budi Bangun", "Hari Malam"]
            },
            {
                q: "Listrik Mati!",
                steps: [
                    { icon: "🔌", text: "Listrik Mati" },
                    { icon: "💡", text: "Lampu Padam" },
                    { icon: "🌑", text: "Kamar Gelap" }
                ],
                target: "Kamar Gelap",
                options: ["Kamar Terang", "Kamar Gelap"]
            },
            {
                q: "Makan Banyak!",
                steps: [
                    { icon: "🍕", text: "Makan Banyak" },
                    { icon: "😋", text: "Perut Kenyang" },
                    { icon: "😴", text: "Jadi Mengantuk" }
                ],
                target: "Jadi Mengantuk",
                options: ["Lapar Lagi", "Jadi Mengantuk"]
            },
            {
                q: "Tekan Saklar!",
                steps: [
                    { icon: "🔘", text: "Tekan Saklar" },
                    { icon: "💨", text: "Kipas Berputar" },
                    { icon: "❄️", text: "Kamar Jadi Dingin" }
                ],
                target: "Kamar Jadi Dingin",
                options: ["Kamar Dingin", "Kamar Panas"]
            },
            {
                q: "Menanam Benih!",
                steps: [
                    { icon: "🌱", text: "Menanam Benih" },
                    { icon: "🌳", text: "Pohon Besar" },
                    { icon: "🍎", text: "Ada Buah Apel" }
                ],
                target: "Ada Buah Apel",
                options: ["Ada Buah Apel", "Ada Batu"]
            },
            {
                q: "Bel Sekolah Bunyi!",
                steps: [
                    { icon: "🔔", text: "Bel Sekolah Bunyi" },
                    { icon: "🏃", text: "Anak Masuk Kelas" },
                    { icon: "📖", text: "Mulai Belajar" }
                ],
                target: "Mulai Belajar",
                options: ["Mulai Belajar", "Main Bola"]
            },
            {
                q: "Awan Hitam!",
                steps: [
                    { icon: "☁️", text: "Awan Hitam" },
                    { icon: "⚡", text: "Ada Petir" },
                    { icon: "⛈️", text: "Hujan Deras" }
                ],
                target: "Hujan Deras",
                options: ["Hari Cerah", "Hujan Deras"]
            },
            {
                q: "Tiup Balon!",
                steps: [
                    { icon: "🎈", text: "Tiup Balon" },
                    { icon: "📏", text: "Balon Membesar" },
                    { icon: "💥", text: "Balon Meletus!" }
                ],
                target: "Balon Meletus!",
                options: ["Balon Hilang", "Balon Meletus!"]
            }
        ];

        let currentMission = 0;

        function initMission() {
            if (currentMission >= missions.length) {
                showVictory();
                return;
            }

            const mission = missions[currentMission];
            document.getElementById('level-indicator').textContent = `Misi ${currentMission + 1} / ${missions.length}`;
            document.getElementById('question-text').textContent = `Jika ${mission.q} ... apa akhirnya?`;
            
            // Reset Cards
            for(let i=1; i<=3; i++) {
                const step = mission.steps[i-1];
                document.getElementById(`icon-${i}`).textContent = step.icon;
                document.getElementById(`text-${i}`).textContent = step.text;
                
                const card = document.getElementById(`step-${i}`);
                card.className = "chain-card p-4 border-2 border-gray-100 rounded-2xl opacity-30 flex items-center gap-4";
                if (i < 3) document.getElementById(`arrow-${i}`).classList.add('opacity-20');
            }

            // Shuffle Options
            const options = [...mission.options].sort(() => Math.random() - 0.5);
            const btnArea = document.getElementById('action-buttons');
            btnArea.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-white border-2 border-indigo-500 text-indigo-600 font-bold py-3 rounded-xl hover:bg-indigo-50 transition-all shadow-sm";
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(opt);
                btnArea.appendChild(btn);
            });
            
            document.getElementById('feedback').textContent = "";
        }

        function handleAnswer(ans) {
            const mission = missions[currentMission];
            if (ans === mission.target) {
                animateChain();
            } else {
                const feedback = document.getElementById('feedback');
                feedback.textContent = "Coba telusuri lagi alurnya...";
                feedback.className = "mt-6 text-center font-bold text-red-500";
            }
        }

        function animateChain() {
            let delay = 0;
            for(let i=1; i<=3; i++) {
                setTimeout(() => {
                    const card = document.getElementById(`step-${i}`);
                    card.classList.remove('opacity-30');
                    card.classList.add('active-chain');
                    if (i < 3) document.getElementById(`arrow-${i}`).classList.remove('opacity-20');
                    
                    if(i === 3) {
                        const feedback = document.getElementById('feedback');
                        feedback.textContent = "BINGO! Logika tersambung!";
                        feedback.className = "mt-6 text-center font-bold text-green-500 animate-bounce";
                        
                        setTimeout(() => {
                            currentMission++;
                            initMission();
                        }, 2000);
                    }
                }, delay);
                delay += 600;
            }
        }

        function showVictory() {
            document.body.innerHTML = `
                <div class="text-center bg-white p-10 rounded-3xl shadow-2xl border-t-8 border-yellow-400 max-w-md w-full">
                    <div class="text-9xl mb-4">👑</div>
                    <h1 class="text-3xl font-bold text-indigo-700">RAJA LOGIKA!</h1>
                    <p class="text-gray-600 mt-2 font-medium">Kamu bisa menyambungkan semua kejadian dengan benar.</p>
                    <button onclick="location.reload()" class="mt-8 px-8 py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 w-full">MAIN LAGI</button>
                </div>`;
        }

        initMission();
    </script>
</body>
</html>
